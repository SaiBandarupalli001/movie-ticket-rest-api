openapi: 3.0.3
info:
  title: Movie Theater Seat Reservation API
  version: 1.0.0
  description: >-
    This API lets a customer check which seats are available for a movie
    showing, temporarily reserve seats while checking out, and release a
    reservation if they change their mind. It covers the seat selection
    portion of buying movie tickets online; payment is handled separately.
servers:
  - url: https://api.example-theater.com/v1
    description: Example API base URL (not a live service)
tags:
  - name: Seat reservations
    description: Check available seats and manage temporary seat holds.
paths:
  /showtimes/{showtimeId}/seats:
    get:
      tags: [Seat reservations]
      summary: Get available seats for a showing
      description: Returns the seat map and each seat's current availability.
      parameters:
        - name: showtimeId
          in: path
          required: true
          description: ID of the selected showing.
          schema:
            type: string
          example: show_204
      responses:
        '200':
          description: Seat availability was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '404':
          description: The showing does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /showtimes/{showtimeId}/reservations:
    post:
      tags: [Seat reservations]
      summary: Hold selected seats for checkout
      description: >-
        Creates a temporary seat hold for the selected showing. A hold
        expires after the time in expiresAt unless checkout is completed.
      parameters:
        - name: showtimeId
          in: path
          required: true
          description: ID of the selected showing.
          schema:
            type: string
          example: show_204
      requestBody:
        required: true
        description: Seats and customer session to associate with the hold.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
            example:
              sessionId: session_71
              seatIds: [A5, A6]
      responses:
        '201':
          description: Seats were temporarily reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: The request is missing seats or contains invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The showing does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: One or more selected seats are no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reservations/{reservationId}:
    delete:
      tags: [Seat reservations]
      summary: Cancel a temporary seat reservation
      description: >-
        Releases seats from an active temporary hold. This endpoint does
        not refund or cancel tickets that have already been purchased.
      parameters:
        - name: reservationId
          in: path
          required: true
          description: ID of the temporary reservation to release.
          schema:
            type: string
          example: res_802
      responses:
        '204':
          description: The reservation was released successfully; no response body.
        '404':
          description: No reservation exists with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The reservation can no longer be released (for example, checkout is complete).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Seat:
      type: object
      required: [seatId, row, number, status]
      properties:
        seatId:
          type: string
          example: A5
        row:
          type: string
          example: A
        number:
          type: integer
          example: 5
        status:
          type: string
          enum: [available, held, sold]
          example: available
    SeatMap:
      type: object
      required: [showtimeId, seats]
      properties:
        showtimeId:
          type: string
          example: show_204
        seats:
          type: array
          items:
            $ref: '#/components/schemas/Seat'
    CreateReservationRequest:
      type: object
      required: [sessionId, seatIds]
      properties:
        sessionId:
          type: string
          description: Identifier for the customer's current browsing session.
          example: session_71
        seatIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          example: [A5, A6]
    Reservation:
      type: object
      required: [reservationId, showtimeId, seatIds, status, expiresAt]
      properties:
        reservationId:
          type: string
          example: res_802
        showtimeId:
          type: string
          example: show_204
        seatIds:
          type: array
          items:
            type: string
          example: [A5, A6]
        status:
          type: string
          enum: [held]
          example: held
        expiresAt:
          type: string
          format: date-time
          example: '2026-11-05T19:45:00Z'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: SEAT_UNAVAILABLE
        message:
          type: string
          example: Seat A5 is no longer available.
